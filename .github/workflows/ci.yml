# The lander's checks (fmt, scripts, deny, clippy, test) through scripts/check, on macOS and Linux. release.yml runs them too,
# before it builds.
#
# Left out: ultimate/check, the Ultimate extension's tests and type checks, which need a full Ultimate clone with its
# node_modules.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called by release.yml, github.workflow is "Release", so a release's checks never queue behind CI's or cancel them.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The integration tests run the sample app with node.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Installs or updates the toolchain rust-toolchain.toml names, with its components.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,shellcheck
      # scripts/check skips its scripts step without actionlint. Its download script takes only an exact version.
      - name: Install actionlint
        run: |
          bin=$RUNNER_TEMP/actionlint
          mkdir -p "$bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash |
            bash -s -- 1.7.12 "$bin"
          echo "$bin" >>"$GITHUB_PATH"
      - run: scripts/check
