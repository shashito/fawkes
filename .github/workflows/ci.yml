# The lander's checks (fmt, deny, clippy, test) through scripts/check, on macOS and Linux.
#
# Left out: ultimate/check, the Ultimate extension's tests and type checks, which need a full Ultimate clone with its
# node_modules.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The integration tests run the sample app with node.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      # Installs or updates the toolchain rust-toolchain.toml names, with its components.
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: scripts/check
