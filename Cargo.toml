[package]
name = "fawkes"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help"] }
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "fs", "net", "param", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = { version = "0.3.18", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Listed explicitly so they stay on if the pedantic group is ever loosened.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
cast_precision_loss = "warn"
# A panic ends the daemon mid-transaction, so daemon paths return `protocol::Error` instead.
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
# Nursery lints, picked one by one: the group as a whole nudges lock scopes and `Self` spellings.
or_fun_call = "warn"
derive_partial_eq_without_eq = "warn"
literal_string_with_formatting_args = "warn"

# A panic anywhere in the daemon ends the process: the init system restarts it and its startup recovers a pending
# switch. Unwinding could leave a thread dead (the supervisor among them) while the daemon goes on answering.
# Tests ignore this setting; the binary they run is built with it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# The release archives (scripts/package): a third smaller without the symbols.
strip = true

[dev-dependencies]
tempfile = "3.27.0"
