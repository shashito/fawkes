[package]
name = "fawkes"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
libc = "0.2.191"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = { version = "0.3.18", default-features = false }
toml = "1.1.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Listed explicitly so they stay on if the pedantic group is ever loosened.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
cast_precision_loss = "warn"
# A panic ends the daemon mid-transaction, so daemon paths return `protocol::Error` instead.
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

# A panic anywhere in the daemon ends the process: the init system restarts it and its startup recovers a pending
# switch. Unwinding could leave a thread dead (the supervisor among them) while the daemon goes on answering.
# Tests ignore this setting; the binary they run is built with it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
