[package]
name = "fawkes"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = { version = "0.3.18", default-features = false }
toml = "1.1.8"

# A panic anywhere in the daemon ends the process: the init system restarts it and its startup recovers a pending
# switch. Unwinding could leave a thread dead (the supervisor among them) while the daemon goes on answering.
# Tests ignore this setting; the binary they run is built with it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
