# cargo deny check: run by the lander on every landing (.ultimate/settings.json).

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included.

[licenses]
# The permissive licences the dependencies use today. A new one fails the check until it is added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
